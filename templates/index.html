<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headconn</title>
    <!-- Include Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            padding-top: 160px; /* Space for fixed text box and button */
        }
        #prompt {
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 2px solid #ccc;
            box-sizing: border-box;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 500px; /* Smaller for mobile */
            height: 80px; /* Fixed small size */
            font-size: 16px;
        }
        .swiper-container {
            display: none;
            width: 100%;
            max-width: 500px; /* Reduced for mobile */
            margin-top: 10px;
        }
        .swiper-slide {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto; /* Fit content */
        }
        .swiper-slide img {
            max-width: 70%;
            max-height: 150px; /* Uniform size, smaller for mobile */
            height: auto;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        .composite-container {
            display: none;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
            text-align: center;
        }
        .composite-container img {
            max-width: 70%; /* Same as shortlisted images */
            max-height: 150px; /* Same as shortlisted images */
            height: auto;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            font-size: 14px; /* Smaller for mobile */
            border-radius: 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            position: fixed;
            top: 100px; /* Below text box */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin-top: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            #prompt {
                width: 95%;
                max-width: 400px;
                height: 70px;
                font-size: 14px;
            }
            button {
                padding: 6px 12px;
                font-size: 12px;
                top: 90px;
            }
            .swiper-container, .composite-container {
                max-width: 400px;
            }
            .swiper-slide img, .composite-container img {
                max-width: 80%;
                max-height: 120px; /* Even smaller for smaller screens */
            }
        }
    </style>
</head>
<body>
    <textarea id="prompt">Harry Potter and Ron Weasley in a flying Tesla Roadster in Space.</textarea>
    <button id="generate-btn" onclick="submitPrompt()">Generate</button>
    <div class="loader" id="loader"></div>
    <div class="swiper-container">
        <div class="swiper-wrapper"></div>
        <!-- Add Pagination -->
        <div class="swiper-pagination"></div>
        <!-- Add Navigation -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>
    <div class="composite-container">
        <img src="" alt="Composite">
    </div>
    <!-- Include Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>
        let swiper = null;

        function initializeSwiper() {
            swiper = new Swiper('.swiper-container', {
                slidesPerView: 'auto',
                spaceBetween: 10,
                centeredSlides: true,
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                navigation: {
                    nextEl: '.swiper-button-prev',
                    prevEl: '.swiper-button-next',
                },
            });
        }

        function submitPrompt() {
            const prompt = document.getElementById('prompt').value;
            const btn = document.getElementById('generate-btn');
            const loader = document.getElementById('loader');
            btn.disabled = true;
            loader.style.display = 'block'; /* Show loader */
            fetch('/api/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.error('Error:', data.error);
                    alert(data.error);
                    btn.disabled = false;
                    loader.style.display = 'none';
                    return;
                }
                const id = data.id;
                console.log('Session ID:', id);
                const interval = setInterval(() => {
                    fetch(`/api/status/${id}`)
                    .then(r => r.json())
                    .then(s => {
                        console.log('Status response:', s);
                        if (s.stage === 'failed') {
                            console.error('Generation failed');
                            alert('Generation failed');
                            clearInterval(interval);
                            btn.disabled = false;
                            loader.style.display = 'none';
                            return;
                        }
                        const swiperContainer = document.querySelector('.swiper-container');
                        const swiperWrapper = document.querySelector('.swiper-wrapper');
                        const compositeContainer = document.querySelector('.composite-container');
                        if (s.img1 && s.img2) {
                            console.log('Setting images:', s.img1, s.img2);
                            if (!swiper) {
                                swiperContainer.style.display = 'block';
                                initializeSwiper();
                                swiperWrapper.innerHTML = `
                                    <div class="swiper-slide"><img src="/${s.img1}?t=${new Date().getTime()}" alt="Image 1"></div>
                                    <div class="swiper-slide"><img src="/${s.img2}?t=${new Date().getTime()}" alt="Image 2"></div>
                                `;
                                swiper.update();
                                console.log('Swiper initialized with shortlisted images');
                            }
                        }
                        if (s.composite) {
                            console.log('Setting composite:', s.composite);
                            compositeContainer.style.display = 'block';
                            compositeContainer.querySelector('img').src = `/${s.composite}?t=${new Date().getTime()}`;
                            console.log('Composite image set');
                            clearInterval(interval);
                            btn.disabled = false;
                            loader.style.display = 'none'; /* Hide loader */
                        }
                    })
                    .catch(err => {
                        console.error('Status fetch error:', err);
                        alert('Error checking status');
                        clearInterval(interval);
                        btn.disabled = false;
                        loader.style.display = 'none';
                    });
                }, 2000);
            })
            .catch(err => {
                console.error('Generate error:', err);
                alert('Error initiating generation');
                btn.disabled = false;
                loader.style.display = 'none';
            });
        }
    </script>
</body>
</html>
